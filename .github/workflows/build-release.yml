name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.101'
      - name: Build, test and package
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $expected = ''
          if ($env:REF_TYPE -eq 'tag') {
            if ($env:REF_NAME -notmatch '^v([0-9]+\.[0-9]+\.[0-9]+)$') { throw 'Expected vX.Y.Z tag' }
            $expected = $Matches[1]
          }
          ./scripts/Build.ps1 -ExpectedVersion $expected
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: artifacts
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" artifacts/* --verify-tag --title "Chu Soneca $RELEASE_TAG" --generate-notes
